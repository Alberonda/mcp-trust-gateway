services:
  - type: web
    name: mcp-trust-gateway
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:http
    healthCheckPath: /health
    envVars:
      - key: HTTP_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_ENCRYPTION_KEY
        sync: false
